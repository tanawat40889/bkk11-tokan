<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-2M7aoJesahgmi0Qe5OE2yirpNg3sQtqrxyQNFRwe4Bs='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cqdzfsucpivsgznfpjxl.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โทกังรวมภาคกรุงเทพ 11</title>
<script>
  try {
    var t = localStorage.getItem('tokan_theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bkkLoader" class="bkk-loader" role="status" aria-live="polite">
  <div class="bkk-loader__mark">
    <span class="bkk-loader__ring" aria-hidden="true"></span>
    <img class="bkk-loader__icon" src="assets/loader-icon.png" alt="" width="72" height="72">
  </div>
  <img class="bkk-loader__brand" src="assets/bkk11-logo.png" alt="BKK11 รวมภาคกรุงเทพ" height="30">
  <p class="bkk-loader__text">กำลังโหลดโทกัง…</p>
  <a class="bkk-loader__retry" href="">โหลดไม่ขึ้น? ลองใหม่</a>
</div>
<script src="loader.js"></script>

<section id="loginView" class="login-view" hidden>
  <img class="corner-logo" src="assets/bkk11-logo.png" alt="BKK11 รวมภาคกรุงเทพ" height="32">
  <button type="button" class="theme-btn" data-theme-toggle></button>
  <form id="loginForm" class="login-card" autocomplete="off">
    <img class="login-logo" src="assets/icon-512.png" alt="" width="72" height="72">
    <h1>โทกังรวมภาคกรุงเทพ 11</h1>
    <label>Username
      <input id="loginName" type="text" required maxlength="100" autocomplete="off">
    </label>
    <label>Password
      <input id="loginCode" type="password" inputmode="numeric" required maxlength="100" autocomplete="off">
    </label>
    <div id="loginError" class="login-error" role="alert" hidden></div>
    <button type="submit">เข้าสู่ระบบ</button>
    <p class="login-hint">พิมพ์ Username + Password เข้าระบบได้เฉพาะหัวหน้าฝ่ายยุวชนชายระดับภาคขึ้นไป และผู้ใหญ่ชายระดับรวมภาค<br>ผู้นำท่านอื่นเข้าได้จาก <b>ลิงก์เข้าระบบ</b> ที่หัวหน้าส่งให้ทาง LINE</p>
  </form>
</section>

<div id="app" hidden>

  <header class="topbar">
    <h1>โทกังรวมภาคกรุงเทพ 11</h1>
    <div class="scope-badge" id="scopeBadge"></div>
    <a id="areasLink" class="logout-btn areas-link" href="areas.html" hidden>จัดการพื้นที่</a>
    <button type="button" class="theme-btn" data-theme-toggle></button>
    <button type="button" id="logoutBtn" class="logout-btn">ออกจากระบบ</button>
    <img class="topbar-logo" src="assets/bkk11-logo.png" alt="BKK11 รวมภาคกรุงเทพ" height="32">
  </header>

  <section class="filters">
    <div class="filters-row1">
      <input type="search" id="searchBox" placeholder="ค้นหาชื่อ / นามสกุล...">
      <button id="filterToggle" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filterPanel">
        <span id="filterToggleLabel">แสดงตัวกรอง</span>
        <span class="filter-count" id="filterCount" hidden>0</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
    </div>

    <div class="filter-panel" id="filterPanel">
      <select id="sortOrder">
        <option value="area">เรียงลำดับ: ตามพื้นที่</option>
        <option value="name">เรียงลำดับ: ตามตัวอักษร</option>
      </select>
      <select id="filterKhet"><option value="">เขต: ทั้งหมด</option></select>
      <select id="filterTambon"><option value="">ตำบล: ทั้งหมด</option></select>
      <select id="filterMoo"><option value="">หมู่: ทั้งหมด</option></select>
      <select id="filterFa"><option value="">ฝ่าย: ทั้งหมด</option></select>
      <select id="filterPo"><option value="">ตำแหน่ง: ทั้งหมด</option></select>

      <label class="checkbox-filter">
        <input type="checkbox" id="filterNoPhoto">
        ขาดรูปถ่ายเท่านั้น
      </label>
      <label class="checkbox-filter">
        <input type="checkbox" id="filterHasNote">
        มีบันทึกเท่านั้น
      </label>

      <div class="filter-panel-actions">
        <button id="resetFilters" type="button" class="btn-outline">ล้างตัวกรอง</button>
        <button id="closeFilterPanel" type="button" class="btn-solid">ปิดตัวกรอง</button>
      </div>
    </div>

    <span class="result-count" id="resultCount"></span>
  </section>

  <div class="list-wrap">
    <main id="cardGrid" class="friend-list"></main>
    <nav id="azIndex" class="az-index" aria-label="ดัชนีตัวอักษร"></nav>
  </div>

  <section class="notes-section">
    <h2>บันทึกช่วยจำทั้งหมด (<span id="notesCount">0</span>)</h2>
    <div id="notesList" class="notes-list"></div>
  </section>

</div>

<dialog id="detailModal">
  <form method="dialog" class="modal-form">
    <button type="button" class="modal-close" id="modalClose">&times;</button>
    <div id="modalBody"></div>
  </form>
</dialog>

<script src="qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
